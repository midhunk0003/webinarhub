
name: WebinarHub iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-15

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter 3.29.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      # 3. Check Flutter environment
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # 4. Get Flutter dependencies
      - name: Flutter Dependencies
        run: flutter pub get

      # 5. Verify required iOS files
      - name: Verify iOS Configuration
        run: |
          set -e

          echo "Checking required files..."

          test -f ios/Podfile
          test -f ios/Runner/Info.plist
          test -f ios/Runner/AppDelegate.swift
          test -f ios/Runner/Runner.entitlements
          test -f ios/Runner.xcodeproj/project.pbxproj

          echo "All required files found."

          echo "Checking deployment target..."

          grep -n "platform :ios" ios/Podfile

          echo "Full Podfile:"
          cat ios/Podfile

          echo "Checking Xcode deployment target:"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # 6. Validate iOS deployment target
      - name: Validate iOS Platform
        run: |
          if ! grep -Eq \
            "^[[:space:]]*platform[[:space:]]+:ios,[[:space:]]*['\"]13\\.0['\"]" \
            ios/Podfile; then
            echo "ERROR: iOS deployment target must be 13.0"
            exit 1
          fi

          echo "iOS deployment target verified: 13.0"

      # 7. Install CocoaPods
      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      # 8. Install iOS dependencies
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      # 9. Build iOS application
      - name: Build iOS Release
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # 10. Verify build output
      - name: Verify iOS Build
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app not found"
            exit 1
          fi

          echo "iOS build completed successfully!"
          ls -lah build/ios/iphoneos/

      # 11. Upload iOS application
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebinarHub-iOS-Build
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
