
name: WebinarHub iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-15

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter 3.29.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      # 3. Check Flutter environment
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # 4. Get Flutter dependencies
      - name: Flutter Dependencies
        run: flutter pub get

      # 5. Verify iOS configuration
      - name: Verify iOS Configuration
        run: |
          set -e

          echo "Checking required files..."

          test -f ios/Podfile
          test -f ios/Runner/Info.plist
          test -f ios/Runner/AppDelegate.swift
          test -f ios/Runner.xcodeproj/project.pbxproj

          echo "Required files found."

          echo "Checking deployment target..."
          grep -n "platform :ios" ios/Podfile

          echo "Checking modular headers..."
          grep -n "use_modular_headers" ios/Podfile

          echo "Checking framework linkage..."
          grep -n "use_frameworks" ios/Podfile

          echo "Checking Xcode deployment target..."
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # 6. Validate deployment target
      - name: Validate iOS Deployment Target
        run: |
          grep -Eq \
            "^[[:space:]]*platform[[:space:]]+:ios,[[:space:]]*['\"]13\\.0['\"]" \
            ios/Podfile

          echo "iOS deployment target verified: 13.0"

      # 7. Setup CocoaPods
      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      # 8. Install CocoaPods dependencies
      - name: Install CocoaPods Dependencies
        run: |
          cd ios

          pod deintegrate

          pod install --repo-update --verbose

      # 9. Verify Pods installation
      - name: Verify Pods Installation
        run: |
          test -f ios/Podfile.lock
          test -d ios/Pods

          echo "CocoaPods installed successfully."

      # 10. Build iOS Release
      - name: Build iOS Release
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # 11. Verify build output
      - name: Verify iOS Build
        run: |
          set -e

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app not found"
            exit 1
          fi

          echo "iOS build completed successfully!"

          ls -lah build/ios/iphoneos/

      # 12. Upload iOS application
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebinarHub-iOS-Build
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
